<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0d1017"/>
  <text x="120" y="170" font-family="DejaVu Sans" font-size="40" fill="#8b93a7">Kapitel 2 · 1994–2002</text>
  <text x="120" y="270" font-family="DejaVu Sans" font-size="80" font-weight="bold" fill="#ede8dc">Das Rauschen und die Briefmarke</text>
  <line x1="120" y1="320" x2="1800" y2="320" stroke="#f7931a" stroke-width="3" stroke-opacity="0.5"/>
  <g font-family="DejaVu Sans">
    <text x="120" y="440" font-size="52" font-weight="bold" fill="#f7931a">1994</text>
    <text x="320" y="440" font-size="40" fill="#ede8dc">Canter &amp; Siegel, der „ewige September": Spam flutet das Netz.</text>
    <text x="320" y="492" font-size="40" fill="#ede8dc">Die Ursünde: gratis für den Sender — teuer für den Empfänger.</text>
    <text x="120" y="610" font-size="52" font-weight="bold" fill="#f7931a">1997</text>
    <text x="320" y="610" font-size="40" fill="#ede8dc">Adam Back erfindet Hashcash: die digitale Briefmarke.</text>
    <text x="320" y="662" font-size="40" fill="#ede8dc">Wer senden will, verbrennt Rechenarbeit.</text>
  </g>
  <rect x="120" y="740" width="1680" height="180" rx="16" fill="#f7931a" fill-opacity="0.08" stroke="#f7931a" stroke-opacity="0.4" stroke-width="2"/>
  <text x="960" y="815" text-anchor="middle" font-family="DejaVu Sans" font-size="44" fill="#ede8dc">Die Idee war genial — aber die Marke kostete nur.</text>
  <text x="960" y="880" text-anchor="middle" font-family="DejaVu Sans" font-size="44" font-weight="bold" fill="#f7931a">Sie zahlte niemals jemanden.</text>
  <text x="1800" y="1010" text-anchor="end" font-family="DejaVu Sans" font-size="26" fill="#5c6474">lightningmail · Historie 2/4</text>
</svg>
