<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum — lightningmail</title>
<style>
:root { --bg:#f5f3ec; --surface:#e8e4d8; --ink:#122338; --muted:#4a5a6e; --accent:#f4b71a; --font:system-ui,-apple-system,'Segoe UI',sans-serif; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.55; display:flex; justify-content:center; padding:clamp(1rem,6vw,4rem) 1rem; }
main { max-width:36rem; width:100% }
.stamp { display:inline-block; border:3px double var(--ink); padding:.55rem 1rem; background:var(--surface); font-weight:600; margin-bottom:2rem; transform:rotate(-1.5deg) }
h1 { font-size:clamp(1.7rem,1.2rem + 1.8vw,2.6rem); margin:0 0 .3em }
h2 { font-size:1rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:2rem 0 .4rem }
p { margin:.3em 0 }
a { color:var(--ink) }
hr { border:none; border-top:3px solid var(--accent); width:4rem; margin:1.6rem 0 }
.meta { color:var(--muted); font-size:.92rem }
.back { margin-top:2.5rem }
</style>
</head>
<body>
<main>
<div class="stamp">⚡ lightningmail.app</div>
<h1>Impressum</h1>

<h2>Angaben gemäß § 5 DDG</h2>
<p>Bernd Holzer<br>
Steinzeugstraße 40<br>
50226 Frechen</p>

<h2>Kontakt</h2>
<p>E-Mail: <a href="mailto:admin@lightningmail.app">admin@lightningmail.app</a></p>

<hr>
<p class="meta">Verantwortlich für den Inhalt nach § 5 DDG: Bernd Holzer (Anschrift wie oben).</p>
<p class="back"><a href="/app/">← Zur App</a></p>
</main>
</body>
</html>
