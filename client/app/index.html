<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122338">
<title>lightningmail</title>
<link rel="manifest" href="./manifest.json">
<style>
:root {
  --bg: #f5f3ec;
  --surface: #ffffff;
  --surface-alt: #eae6da;
  --surface-hover: #f0ece0;
  --ink: #122338;
  --muted: #526377;
  --faint: #6b7a8c;
  --border: #d8d3c4;
  --accent: #f4b71a;
  --accent-hover: #e5a80b;
  --accent-ink: #122338;
  --navy: #122338;
  --navy-light: #1c3350;
  --danger: #a82020;
  --ok: #1b6e38;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 2px 10px rgba(18, 35, 56, 0.06);
  --shadow-lg: 0 12px 34px rgba(18, 35, 56, 0.16);
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: clamp(14px, 0.92rem + 0.18vw, 17px);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Top Application Bar */
header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) clamp(12px, 1.8vw, 24px) 8px;
  background: var(--navy);
  color: #f5f3ec;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  min-height: 54px;
  position: sticky;
  top: 0;
  z-index: 30;
}
header h1 {
  font-size: clamp(16px, 1.05rem + 0.25vw, 20px);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
#who {
  color: #b9c7d8 !important;
  font-size: 0.85em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#balance {
  margin-left: auto;
  font-weight: 700;
  font-size: 0.88em;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
header button {
  background: rgba(255,255,255,0.12);
  color: #f5f3ec;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 6px 11px;
  font-size: 0.82em;
}
header button:hover {
  background: rgba(255,255,255,0.22);
  color: #fff;
}

/* Controls: Buttons, Inputs, Selects */
button {
  font-family: inherit;
  font-size: 0.92em;
  font-weight: 600;
  color: var(--ink);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  cursor: pointer;
  transition: background 0.14s ease, border-color 0.14s ease, transform 0.06s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
button:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent-hover);
  color: var(--accent-ink);
}
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.48; cursor: not-allowed; }
button[type="submit"], #l-login, #l-quickgo, #w-next, #r-go, #oidc-ok, #wd-go {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}
button[type="submit"]:hover:not(:disabled), #l-login:hover, #l-quickgo:hover, #w-next:hover:not(:disabled), #r-go:hover, #oidc-ok:hover, #wd-go:hover:not(:disabled) {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent-hover);
}

input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
select,
textarea {
  font-family: inherit;
  font-size: 0.96em;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  width: 100%;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(244, 183, 26, 0.28);
}
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--navy);
  vertical-align: middle;
  margin-right: 6px;
}
label {
  font-size: 0.88em;
  font-weight: 600;
  color: var(--ink);
}

/* Window / Dialog Cards (replaces legacy 98.css .window) */
.window, .card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card {
  padding: clamp(16px, 2vw, 26px);
  max-width: 88ch;
}
.title-bar {
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
  font-weight: 700;
  font-size: 0.98em;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.title-bar-text { color: #fff; }
.window-body {
  padding: clamp(14px, 1.8vw, 22px);
}

/* Login Card */
.login {
  max-width: 470px;
  margin: clamp(16px, 5vh, 56px) auto;
  box-shadow: var(--shadow-lg);
}
.login .window-body { display: grid; gap: 12px; }
.login .row, .window-body .row {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.login .row button, .window-body .row button { flex: 1 1 auto; }
.signup-hero-btn {
  width: 100%;
  background: var(--accent) !important;
  color: var(--accent-ink) !important;
  border: 2px solid var(--accent-hover) !important;
  padding: 13px 16px;
  font-size: 1.02em;
  font-weight: 800;
  border-radius: var(--radius);
  box-shadow: 0 3px 10px rgba(244, 183, 26, 0.28);
}
.signup-hero-btn:hover { filter: brightness(0.97); }
.login-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 0.78em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 4px 0 0;
}
.login-divider::before, .login-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}
.field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 480px) {
  .field-grid { grid-template-columns: 1fr; }
}
.alt-methods {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  padding: 8px 12px;
}
.alt-methods summary {
  cursor: pointer;
  font-size: 0.86em;
  font-weight: 600;
  color: var(--muted);
  user-select: none;
}
.alt-methods[open] summary {
  margin-bottom: 10px;
  color: var(--ink);
}
.file-btn-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1 1 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 0.9em;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
}
.file-btn-label:hover {
  background: var(--accent);
  border-color: var(--accent-hover);
}
/* Modern Wizard Styling */
.wiz-steps {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.wiz-step {
  flex: 1;
  text-align: center;
  font-size: 0.78em;
  font-weight: 700;
  padding: 6px 8px;
  border-radius: 999px;
  background: var(--surface-alt);
  color: var(--muted);
}
.wiz-step.active {
  background: var(--navy);
  color: #fff;
}
.wiz-step.done {
  background: #d1fae5;
  color: #065f46;
}
.seed-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-family: var(--mono);
  font-size: 0.86em;
  margin: 10px 0;
}
@media (max-width: 480px) {
  .seed-grid { grid-template-columns: repeat(2, 1fr); font-size: 0.9em; }
}
.seed-word {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.seed-word b { color: var(--muted); font-size: 0.82em; min-width: 1.6em; }
.quiz-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 8px;
}

/* Main 3-Pane Workspace (Linux 1080p & 4K optimized) */
main {
  display: grid;
  grid-template-columns: clamp(210px, 15vw, 270px) clamp(320px, 27vw, 460px) minmax(0, 1fr);
  height: calc(100dvh - 54px);
  max-width: 2560px;
  margin: 0 auto;
}
main.hidden, .hidden { display: none !important; }

/* Left Navigation Rail */
nav {
  background: var(--surface-alt);
  border-right: 1px solid var(--border);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}
nav button {
  width: 100%;
  justify-content: flex-start;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  color: var(--ink);
}
nav button:hover {
  background: rgba(18, 35, 56, 0.07);
  border-color: transparent;
  color: var(--ink);
}
nav button.on {
  background: var(--navy);
  color: #fff;
  box-shadow: 0 2px 6px rgba(18, 35, 56, 0.16);
}
#nav-new {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent-hover);
  font-weight: 700;
  margin: 4px 0 8px;
}
#nav-new.on, #nav-new:hover {
  background: var(--accent-hover);
  color: var(--accent-ink);
}
#nav-out { margin-top: auto; color: var(--muted); }

/* Center Message / Item List */
#list {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
}
#list .row {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.12s ease;
}
#list .row:hover { background: var(--surface-hover); }
#list .row.sel {
  background: var(--navy);
  color: #fff;
  border-left: 4px solid var(--accent);
  padding-left: 12px;
}
#list .row.sel .subj { color: #fff !important; }
#list .row.sel .meta { color: #cbd5e1 !important; }
.subj {
  font-weight: 700;
  font-size: 0.98em;
  line-height: 1.32;
  margin-bottom: 3px;
  word-break: break-word;
}
.meta {
  font-size: 0.82em;
  color: var(--muted);
  line-height: 1.4;
}

/* Right Detail / Reading / Compose Pane */
#detail {
  padding: clamp(16px, 2.2vw, 32px);
  overflow-y: auto;
  background: var(--bg);
}
.attach {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 8px 8px 0 0;
  padding: 8px 14px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.86em;
  font-weight: 600;
  transition: background 0.14s ease;
}
.attach:hover {
  background: var(--accent);
  border-color: var(--accent-hover);
}
.classify {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 0.86em;
  color: var(--muted);
}

/* Compose & Address Book Forms */
form.compose {
  display: grid;
  gap: 12px;
  max-width: 78ch;
  background: var(--surface);
  padding: clamp(16px, 2vw, 26px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
form.compose textarea {
  min-height: 220px;
  line-height: 1.55;
  resize: vertical;
}
.abbar {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-alt);
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 5;
}
.abform {
  display: grid;
  grid-template-columns: 11em 1fr;
  gap: 8px 12px;
  align-items: center;
  max-width: 68ch;
}
.abform label { text-align: right; color: var(--muted); }

/* 4K Ultra-HD Desktop Scaling (>= 2200px) */
@media (min-width: 2200px) {
  html, body { font-size: 18px; }
  header { min-height: 64px; }
  main {
    grid-template-columns: 310px 540px minmax(0, 1fr);
    height: calc(100dvh - 64px);
  }
  .card, form.compose { max-width: 96ch; }
}

/* Tablet & Mobile Landscape (Compact Rail + Split List/Detail) */
@media (max-width: 1024px) and (min-width: 681px) {
  main {
    grid-template-columns: 175px minmax(250px, 36vw) minmax(0, 1fr);
  }
  nav button { padding: 9px 10px; font-size: 0.88em; }
}

/* Android / Phone Landscape (Short vertical height, wide screen) */
@media (max-height: 540px) and (orientation: landscape) {
  header { min-height: 44px; padding-top: 4px; padding-bottom: 4px; }
  main {
    grid-template-columns: 155px 34vw minmax(0, 1fr);
    height: calc(100dvh - 44px);
  }
  nav { padding: 6px; gap: 3px; }
  nav button { padding: 7px 9px; min-height: 38px; font-size: 13px; }
  #list .row { padding: 9px 12px; }
  #detail { padding: 12px; }
  form.compose textarea { min-height: 110px; }
}

/* Android / Mobile Portrait (<= 680px): Thumb-friendly Bottom Bar & Master/Detail */
@media (max-width: 680px) {
  header {
    flex-wrap: wrap;
    gap: 6px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
  }
  header h1 { font-size: 17px; }
  #who { max-width: 38vw; }
  .login { margin: 12px; max-width: none; }
  .login button, form.compose button, .classify button, .abbar button {
    min-height: 46px;
  }
  input:not([type="checkbox"]):not([type="radio"]), select {
    min-height: 44px;
    font-size: 16px; /* Prevents iOS/Android auto-zoom on focus */
  }
  main {
    display: flex;
    flex-direction: column;
    height: auto;
    min-height: calc(100dvh - 54px);
    padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  }
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 40;
    flex-direction: row;
    overflow-x: auto;
    background: var(--navy);
    border-right: none;
    border-top: 1px solid rgba(255,255,255,0.14);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    gap: 6px;
    box-shadow: 0 -4px 16px rgba(18, 35, 56, 0.18);
  }
  nav button {
    width: auto;
    flex: 0 0 auto;
    min-height: 44px;
    padding: 8px 13px;
    color: #dbe4ee;
    font-size: 13.5px;
    white-space: nowrap;
  }
  nav button.on {
    background: var(--accent);
    color: var(--accent-ink);
  }
  #nav-new { margin: 0; }
  #nav-out { margin-top: 0; color: #dbe4ee; }
  #list {
    width: 100%;
    max-height: 42dvh;
    border-right: none;
    border-bottom: 2px solid var(--border);
  }
  #list:empty { display: none; }
  #list .row { padding: 13px 14px; }
  #detail {
    flex: 1;
    padding: 14px 12px 28px;
  }
  .abform {
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .abform label { text-align: left; margin-top: 6px; }
}
</style>
</head>
<body>
<header>
  <h1>⚡ lightningmail</h1>
  <span id="who" class="meta"></span>
  <button id="btn-keywrap" style="display:none">🔐 Key-Tresor (.lmkey)</button>
  <button id="btn-passkey" style="display:none" title="Fingerabdruck, FaceID oder YubiKey hinzufügen">🔑 Passkey</button>
  <span id="balance"></span>
</header>
<div id="login" class="login window">
  <div class="title-bar"><div class="title-bar-text">⚡ lightningmail — Postfach</div></div>
  <div class="window-body">
    <div class="row" id="l-quick" style="display:none;margin-top:0">
      <button id="l-quickgo" style="flex:2;padding:11px 14px"></button>
      <button id="l-forget" title="Gespeicherten Schlüssel von diesem Gerät löschen">🗑 Vergessen</button>
    </div>

    <button id="l-signup" class="signup-hero-btn" type="button">
      ✨ Neues Konto in 30 Sek. anlegen (+10.000 Test-Sats)
    </button>

    <div class="login-divider">Oder bestehendes Konto öffnen</div>

    <div class="field-grid">
      <div>
        <label for="l-acct">Kontoname</label>
        <input id="l-acct" value="alice" placeholder="z. B. alice" autocomplete="username" autocapitalize="none">
      </div>
      <div>
        <label for="l-relay">Relay-Server</label>
        <select id="l-relay">
          <option value="/relay-a">alpha (lightningmail.app)</option>
          <option value="/relay-b">beta (lightningmail.app)</option>
        </select>
      </div>
    </div>

    <div class="row" id="l-passrow" style="display:none;align-items:center">
      <input type="password" id="l-pass" placeholder="Passphrase für .lmkey eingeben" style="flex:1">
      <button id="l-passbtn" type="button">🔓 Entschlüsseln</button>
    </div>

    <div class="row" style="margin-top:2px">
      <button id="l-passkey" type="button" style="background:var(--navy);color:#fff;border-color:var(--navy);padding:11px 14px">
        🔑 Mit Passkey / Fingerabdruck anmelden
      </button>
    </div>

    <details class="alt-methods">
      <summary>Weitere Anmeldemethoden (Schlüsseldatei, 24 Wörter, Demo)</summary>
      <div class="row" style="margin-top:4px">
        <label class="file-btn-label" for="l-file">
          📂 Schlüsseldatei (.lmkey / .key)
        </label>
        <input type="file" id="l-file" accept=".key,.pem,.lmkey" style="display:none">
        <button id="l-words" type="button" title="Konto aus dem 24-Wort-Backup wiederherstellen">🌱 24 Wörter</button>
      </div>
      <div class="row">
        <button id="l-demo" type="button">⚡ Demo-Konto (alice) testen</button>
        <button id="l-login" type="button" style="display:none">Anmelden</button>
      </div>
    </details>

    <p id="l-err" class="meta" style="margin:0"></p>
    <p class="meta" style="text-align:center;margin:2px 0 0"><a href="/" target="_blank" rel="noopener">Startseite</a> · <a href="/forum" target="_blank" rel="noopener">Forum &amp; Paywall</a> · <a href="/architecture" target="_blank" rel="noopener">Architektur</a> · <a href="/impressum" target="_blank" rel="noopener">Impressum</a></p>
  </div>
</div>
<main class="hidden" id="app">
  <nav>
    <button id="nav-new">✉ Schreiben</button>
    <button id="nav-in" class="on">📥 Posteingang</button>
    <button id="nav-sent">📤 Gesendet</button>
    <button id="nav-dra">📝 Entwürfe</button>
    <button id="nav-ab">📇 Adressbuch</button>
    <button id="nav-ums">💶 Umsätze</button>
    <button id="nav-spam">🛡 Unerwünscht</button>
    <button id="nav-out">🚪 Abmelden</button>
  </nav>
  <div id="list"></div>
  <div id="detail"></div>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
