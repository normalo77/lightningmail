  tls_cert_path: /root/lightningmail/test/docker/data/lnd-alpha/tls.cert
  macaroon_path: /root/lightningmail/test/docker/data/lnd-alpha/data/chain/bitcoin/regtest/admin.macaroon
postage:
  foreign_sats: 10
  contact_sats: 0
  min_sats: 1
  # Etappe 7 (§22): Byte-Porto — 10 mEUR/MiB = 1 ct pro MiB (Vorschlag, Bernd kann vetieren)
  byte_porto_meur_per_mb: 10
peers:
  - name: beta
    url: http://127.0.0.1:9443
    token: lm-relay-mirror-secret
    node_pubkey: 034eb8af6a688cf339349a303c0403b635ad126176075cc387e1f0e74ae455e16e

relay_secret: lm-relay-mirror-secret

webauthn:
  rp_id: "lightningmail.app"
  rp_name: lightningmail
  origins:
    - "https://lightningmail.app"
    - "https://bmail.192-168-177-77.sslip.io:5173"

# Kurs-Feed (§25/§22) — Tageskurs fuer Steuerstempel und Byte-Porto,
# plus 429-Budget fuer anonyme Key-Lookups.
# Regtest-Betrieb: manueller Testkurs (rate_src="manual", Testdaten-Kennzeichnung
# gemaess §25). Mainnet: manual_eur_per_btc loeschen, rate_url setzen (Tageskurs,
# z.B. https://api.binance.com/api/v3/ticker/price?symbol=BTCEUR).
rates:
  manual_eur_per_btc: 50000
  public_rpm: 30

# IdP (§21/§29): "Sign in with lightningmail" — OIDC Authorization-Code + PKCE.
# ES256-IdP-Schluessel wird erzeugt: data_dir/idp_es256.pem (600) — NIEMALS
# loeschen, sonst bricht das Vertrauen aller angebundenen Dienste.
# Foederations-Beweis = BIP340-Sig des Mailbox-Keys (bmail-Claim im ID-Token).
oidc:
  issuer: "https://relay-a.lightningmail.app"
  login_page: "https://lightningmail.app/app/"
  address_domain: "lightningmail.app"
  clients:
    - id: demo
      name: "Demo-Dienst"
      redirect_uris:
        - "https://relay-a.lightningmail.app/oidc/demo-callback.html"
drive:
  enabled: true
  quota_mb: 5120
  tiers:
    - {gb: 50, sats: 100}
    - {gb: 500, sats: 400}
