<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lightningmail</title>
<link rel="manifest" href="./manifest.json">
<!-- Etappe A: Win95-Look wie ein 90er-Mailclient. 98.css v0.1.21 (MIT), vendored. -->
<link rel="stylesheet" href="./98.css">
<style>
* { box-sizing:border-box }
body { background:#c0c0c0 }
header { display:flex; gap:12px; align-items:baseline; padding:8px 12px; border-bottom:1px solid #808080; background:#c0c0c0 }
header h1 { font-size:15px; margin:0 }
#balance { margin-left:auto; font-size:12px; white-space:nowrap }
main { display:flex; min-height:calc(100vh - 42px) }
nav { width:200px; border-right:1px solid #808080; padding:8px; background:#c0c0c0 }
nav button { display:block; width:100%; text-align:left; margin:2px 0 }
#list { width:340px; border-right:1px solid #808080; overflow-y:auto; background:#fff }
#list .row { padding:6px 10px; border-bottom:1px solid #dfdfdf; cursor:pointer }
#list .row:hover { background:#e8e8e8 }
#list .row.sel { background:#000080; color:#fff }
#list .row.sel .meta { color:#d0d0e8 }
.subj { font-weight:bold }
.meta { font-size:11px; color:#555 }
#detail { flex:1; padding:12px; overflow-y:auto }
.card { background:#fff; border:2px inset #dfdfdf; padding:12px 14px; max-width:76ch }
.attach { display:inline-block; margin:4px 8px 0 0; padding:4px 10px; cursor:pointer; font-size:12px }
.classify { margin-top:12px; font-size:12px }
.classify button, .compose button, .login button { margin:2px }
form.compose { display:grid; gap:6px; max-width:64ch }
form.compose input, form.compose textarea { width:100% }
form.compose textarea { min-height:160px }
#portofuss { font-size:12px }
.login { max-width:46ch; margin:48px auto; padding:0 }
.login .window-body { display:grid; gap:6px }
.login label { font-size:12px }
.login input, .login select { width:100% }
.login .row { display:flex; gap:8px; margin-top:10px }
.hidden { display:none }
.abbar { display:flex; gap:4px; padding:6px; border-bottom:1px solid #dfdfdf; background:#c0c0c0; flex-wrap:wrap }
.abform { display:grid; grid-template-columns:9em 1fr; gap:4px 8px; align-items:center; max-width:56ch }
.abform label { text-align:right; font-size:12px }
.abform input, .abform textarea, .abform select { width:100% }
.tabrow { display:flex; gap:4px; margin-bottom:8px }
@media (max-width:860px){ nav{width:64px} #list{width:200px} }
/* Handy: Win95-Layout gestapelt (Nav = Toolbar, Liste oben, Detail unten), Touch ≥44px */
@media (max-width:600px){
  header { flex-wrap:wrap }
  .login { margin:16px 8px; max-width:none }
  .login .row { flex-wrap:wrap }
  .login button { min-height:44px; flex:1 1 auto }
  .login input, .login select { min-height:40px }
  .login input[type=file] { width:100% }
  main { flex-direction:column; min-height:0 }
  nav { width:100%; display:flex; gap:2px; padding:4px; overflow-x:auto; border-right:none; border-bottom:1px solid #808080 }
  nav button { width:auto; min-height:44px; white-space:nowrap }
  #list { width:100%; max-height:38vh; border-right:none; border-bottom:1px solid #808080 }
  #list .row { padding:10px }
  #detail { min-height:40vh }
  form.compose button, .classify button { min-height:44px }
  header button { min-height:40px }
  form.compose input, .abform input, .abform select, input[type=file] { min-height:40px }
}
</style>
</head>
<body>
<header><h1>⚡ lightningmail</h1><span id="who" class="meta"></span><button id="btn-keywrap" style="display:none">🔐 Key verschlüsselt speichern</button> <button id="btn-passkey" style="display:none" title="YubiKey, Handy (FaceID/Fingerabdruck) o.ä. hinzufügen">🔑 Passkey hinzufügen</button> <span id="balance"></span></header>
<div id="login" class="login window">
  <div class="title-bar"><div class="title-bar-text">lightningmail — Anmelden</div></div>
  <div class="window-body">
  <div class="row" id="l-quick" style="display:none">
    <button id="l-quickgo" style="flex:2"></button>
    <button id="l-forget" title="Gespeicherten Schlüssel von diesem Gerät löschen">🗑 Vergessen</button>
  </div>
  <label>Relay</label>
  <select id="l-relay"><option value="/relay-a">alpha (Portofino 8443)</option><option value="/relay-b">beta (9443)</option></select>
  <label>Konto</label><input id="l-acct" value="alice">
  <div class="row">
    <button id="l-signup">＋ Neues Konto</button>
    <button id="l-demo">Demo-Schlüssel laden</button>
    <label style="align-self:center">oder Datei: <input type="file" id="l-file" accept=".key,.pem,.lmkey" style="width:140px"></label>
  </div>
  <div class="row" id="l-passrow" style="display:none;align-items:center">
    <input type="password" id="l-pass" placeholder="Passphrase" style="flex:1">
    <button id="l-passbtn">Entschluesseln</button>
  </div>
  <div class="row"><button id="l-login">Anmelden</button>
    <button id="l-passkey">🔑 Passkey / Handy</button>
    <button id="l-words" title="Konto aus dem 24-Wort-Backup wiederherstellen">🌱 Wörter-Recovery</button></div>
  <p id="l-err" class="meta"></p>
  <p class="meta" style="text-align:right;margin:6px 0 0"><a href="/impressum" target="_blank" rel="noopener">Impressum</a></p>
  </div>
</div>
<main class="hidden" id="app">
  <nav>
    <button id="nav-in" class="on">📥 Posteingang</button>
    <button id="nav-spam">Unerwünscht</button>
    <button id="nav-sent">📤 Gesendet</button>
    <button id="nav-dra">Entwürfe</button>
    <button id="nav-new">✉ Schreiben</button>
    <button id="nav-ab">📇 Adressbuch</button>
    <button id="nav-ums">💶 Umsätze</button>
    <button id="nav-out">Abmelden</button>
  </nav>
  <div id="list"></div>
  <div id="detail"></div>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
